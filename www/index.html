<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b52">
<title>Quran Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f1e4;--surface:#fffdf7;--ink:#1c2a23;--muted:#667a6f;--line:#e4dccb;--primary:#1f6b52;--on-primary:#fff;--accent:#b8893b;--hl:#fff3cf;--fs:32px}
:root[data-theme=dark]{--bg:#0e1613;--surface:#16211c;--ink:#e6eee8;--muted:#92a89c;--line:#25352d;--primary:#2f8a6b;--on-primary:#fff;--accent:#d9b25f;--hl:#2a3a22}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1613;--surface:#16211c;--ink:#e6eee8;--muted:#92a89c;--line:#25352d;--primary:#2f8a6b;--on-primary:#fff;--accent:#d9b25f;--hl:#2a3a22}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;accent-color:var(--primary)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ar,.arn,.art,.sn{font-family:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Droid Naskh Shift Alt","Traditional Arabic",serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 14px;background:var(--primary);color:var(--on-primary)}
.bar .ttl{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;padding:0 6px}
.bar .ttl b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{font-size:22px;opacity:.95}
.ib{background:none;border:0;color:inherit;min-width:42px;height:42px;border-radius:21px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{background:rgba(255,255,255,.18)}
.ib.sm{color:var(--muted);min-width:36px;height:36px}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.search{width:100%;padding:12px 14px;margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px}
.resume{display:block;margin:4px 0 8px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent)}
.resume small{display:block;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.row .num{flex:none;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--primary);font-weight:600}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm small{color:var(--muted)}
.row .arn{font-size:24px;color:var(--primary);flex:none}
:root[data-theme=dark] .row .arn,:root[data-theme=dark] .row .num{color:#7fd1b0}
.shead{text-align:center;padding:18px 0 6px}
.shead .sn{font-size:40px;color:var(--primary);line-height:1.4}
.shead .sm{color:var(--muted);font-size:14px}
.bism{text-align:center;font-size:calc(var(--fs)*1.05);padding:10px 0 14px;color:var(--ink);border-bottom:1px solid var(--line);margin-bottom:6px}
.v{padding:16px 2px 8px;border-bottom:1px solid var(--line);scroll-margin-top:62px}
.v.flash{background:var(--hl);border-radius:10px;padding-left:8px;padding-right:8px}
.ar{font-size:var(--fs);line-height:2.15;text-align:right}
.vm{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.45em;padding:0 .2em;margin:0 .15em;border:1.5px solid var(--accent);border-radius:50%;font-size:.5em;color:var(--accent);vertical-align:middle;line-height:1}
.tr{margin:6px 0 0;font-size:max(15px,calc(var(--fs)*.52));line-height:1.55;color:var(--ink);opacity:.9}
.tn{color:var(--accent);font-weight:600;font-size:.85em}
.no-tr .tr{display:none}
.vt{display:flex;gap:8px;margin:8px 0 4px}
.vt button{background:none;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.vt button.on{color:var(--accent);border-color:var(--accent)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.btn{display:inline-block;border:0;background:var(--primary);color:var(--on-primary);padding:11px 16px;border-radius:12px;font-size:15px;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
:root[data-theme=dark] .btn.ghost{color:#7fd1b0;border-color:#7fd1b0}
.btn:disabled{opacity:.6}
.state{text-align:center;color:var(--muted);padding:30px 10px}
.state.err{color:var(--ink)}
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px 24px}
.panel h3{margin:14px 0 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.panel h3:first-child{margin-top:0}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.panel input[type=range]{flex:1}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 12px}
.prog i{display:block;height:100%;width:0;background:var(--primary);transition:width .25s}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
#offs{margin:4px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-label="Settings">
    <h3>Display</h3>
    <label>Arabic text size <span id="fsv"></span></label>
    <input id="fs" type="range" min="22" max="56" step="2" style="width:100%">
    <label class="sw"><span>Show English translation</span><input id="trt" type="checkbox"></label>
    <div class="seg" role="group" aria-label="Theme">
      <button data-act="theme" data-v="auto">Auto</button>
      <button data-act="theme" data-v="light">Light</button>
      <button data-act="theme" data-v="dark">Dark</button>
    </div>
    <h3>Offline</h3>
    <p id="offs"></p>
    <div class="prog"><i id="pbar"></i></div>
    <button class="btn" data-act="dl" style="width:100%">Download the whole Quran (about 2 MB)</button>
    <h3>About</h3>
    <p class="note">Arabic text: Uthmani script from the Tanzil project, delivered by the Al Quran Cloud service. English: Sahih International. Please check anything important against a printed mushaf.</p>
    <button class="btn ghost" data-act="closeSheet" style="width:100%;margin-top:10px">Done</button>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>

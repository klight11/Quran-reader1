name: Fetch data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Quran translations, hadith and fonts
        run: |
          python3 -u scripts/fetch_data.py www > fetch-log.txt 2>&1 || echo "SCRIPT FAILED" >> fetch-log.txt
          du -sh www/data www/fonts >> fetch-log.txt 2>&1 || true
      - name: Commit data in pieces
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git status --short | head -5
          git add fetch-log.txt; git commit -m "fetch log" -q; git push -q || true
          for d in www/fonts www/data/manifest.json www/data/quran www/data/hadith/books.json www/data/hadith/*/; do
            git add "$d"
            if ! git diff --cached --quiet; then
              git commit -q -m "data: $d"
              ok=0
              for t in 1 2 3; do git push -q 2>>push-error.txt && ok=1 && break; sleep 5; done
              [ $ok = 1 ] || { echo "PUSH FAILED $d" >> push-error.txt; git reset -q --hard HEAD~1; }
            fi
          done
          if [ -f push-error.txt ]; then git add push-error.txt; git commit -q -m "push errors"; git push -q || true; fi

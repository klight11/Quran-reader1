name: Fetch data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Quran translations, hadith and fonts
        run: python3 scripts/fetch_data.py www | tee fetch-log.txt
      - name: Commit data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add www/data www/fonts
          git commit -m "Add Quran translations, hadith books and fonts" || true
          git push

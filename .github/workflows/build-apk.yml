name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download Quran text and recitation audio
        run: python3 scripts/fetch_assets.py android/app/src/main/assets
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Quran-Reader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Quran Reader v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'scripts/fetch_data.py', '.github/workflows/fetch-data.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Put the web app inside the Android project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r www/. android/app/src/main/assets/
          du -sh android/app/src/main/assets
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Test the APK offline
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          python scripts/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Quran-Reader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Quran Reader v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

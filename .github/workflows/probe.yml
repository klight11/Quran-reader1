name: Probe sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
          echo "### Quran editions (hi, ps, fa, en, ar, ur)"
          curl -fsSL https://api.alquran.cloud/v1/edition | python3 -c "
          import json,sys
          for e in json.load(sys.stdin)['data']:
              if e['language'] in ('hi','ps','fa','en','ar','ur','prs') : print(e['identifier'],'|',e['language'],'|',e['englishName'],'|',e['type'],'|',e['format'])
          "
          echo; echo "### hadith-api editions"
          curl -fsSL https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for k,v in d.items():
              for e in v['collection']:
                  print(k,'|',e['name'],'|',e['language'],'|',e.get('author','')[:40])
          "
          echo; echo "### reciters"
          for r in Maher_AlMuaiqly_64kbps Alafasy_64kbps Abdul_Basit_Murattal_64kbps Abdurrahmaan_As-Sudais_64kbps Saood_ash-Shuraym_64kbps Ghamadi_40kbps Abdullah_Basfar_64kbps; do
            for f in 001001 114006; do echo "$r $f $(curl -s -o /dev/null -m 20 -w '%{http_code} %{size_download}' -H 'Origin: https://x.test' https://everyayah.com/data/$r/$f.mp3)"; done; done
          echo; echo "### font"
          for u in https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf; do echo "$u $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -L $u)"; done
          } > probe2.txt 2>&1 || true
          cat probe2.txt | head -150
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe2.txt; git commit -m "probe results" ; git push

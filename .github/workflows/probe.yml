name: Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py > probe.txt 2>&1 || true
      - run: |
          git config user.name x; git config user.email x@x.x
          git add probe.txt; git commit -qm probe; git push -q
